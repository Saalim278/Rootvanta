<h2>Bug Tracker Login</h2>

<form (ngSubmit)="onLogin()" #loginForm="ngForm">
  <input
    type="text"
    name="username"
    [(ngModel)]="username"
    placeholder="Username"
    required
  />

  <input
    type="password"
    name="password"
    [(ngModel)]="password"
    placeholder="Password"
    required
  />

  <button type="submit" [disabled]="loginForm.invalid">
    Login
  </button>
</form>

<p *ngIf="errorMessage" style="color: red">
  {{ errorMessage }}
</p>

<p *ngIf="successMessage" style="color: green">
  {{ successMessage }}
</p>
